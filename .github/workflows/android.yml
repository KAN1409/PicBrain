name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PICBRAIN_SIGNING_PASSWORD: ${{ secrets.PICBRAIN_SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secret
        shell: bash
        run: |
          if [ -z "$PICBRAIN_SIGNING_PASSWORD" ]; then
            echo "::error::Missing repository secret PICBRAIN_SIGNING_PASSWORD"
            exit 1
          fi

      - name: Restore permanent signing key
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/picbrain-release.keystore"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/picbrain-release.keystore.enc \
            -out "$KEYSTORE_PATH" \
            -pass env:PICBRAIN_SIGNING_PASSWORD
          chmod 600 "$KEYSTORE_PATH"
          echo "PICBRAIN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned Arabic OCR best model
        shell: bash
        run: |
          MODEL_DIR="app/src/main/assets/tessdata"
          MODEL_FILE="$MODEL_DIR/ara.traineddata"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/ara.traineddata" \
            --output "$MODEL_FILE"
          test -s "$MODEL_FILE"
          test "$(stat -c%s "$MODEL_FILE")" -gt 1000000

      - name: Build stable signed debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PicBrain-v0.0.7-stable-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
